<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recent Inputs</title>
  <link rel="stylesheet" href="/_nyerk/nyerk.css">
  <style>
    :root { --input-size: 18px; --input-width: 320px; }
    html, body { width: var(--input-width); overflow: hidden; background: transparent !important; }
    body { padding: 7px; }
    body.idle #list { display: none; }
    #list { display: flex; flex-direction: column; gap: 5px; }
    .entry {
      display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 6px 10px;
      border: 1px solid rgba(98, 104, 138, .55); border-radius: 9px;
      background: rgba(14, 16, 29, .88); box-shadow: 0 3px 14px rgba(0, 0, 0, .28);
      opacity: var(--overlay-opacity, 1);
    }
    .entry.held { border-color: rgba(61, 214, 140, .8); background: rgba(13, 35, 29, .94); }
    .badge { flex: 0 0 auto; min-width: 32px; text-align: center; padding: 3px 6px; border: 1px solid #4d4c8e; border-radius: 6px; background: #202044; color: #c1c5ff; font-size: calc(var(--input-size) * .68); font-weight: 650; }
    .badge.mouse { border-color: #355a65; background: #172b33; color: #a6e4f4; }
    .label { overflow-wrap: anywhere; font-size: var(--input-size); font-weight: 560; line-height: 1.2; color: #f4f4fa; text-shadow: 0 1px 2px #000; }
    .timer-duration { flex: 0 0 auto; font-size: 12px; font-variant-numeric: tabular-nums; color: #d5d7e4; white-space: nowrap; }
    .empty { padding: 8px 10px; border: 1px dashed rgba(137, 141, 171, .65); border-radius: 9px; background: rgba(14, 16, 29, .78); color: #d5d7e4; font-size: 13px; opacity: var(--overlay-opacity, 1); }
    body.frameless .empty { border-color: transparent; background: transparent; box-shadow: none; }
  </style>
</head>
<body>
  <div id="list" aria-live="off"><div class="empty">Press a key or click to show input here</div></div>
  <script src="/_nyerk/nyerk.js"></script>
  <script src="hud.js"></script>
</body>
</html>
